<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiaoYoung · 快捷入口</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/element-plus"></script>
</head>

<body>
    <div id="app">
        <el-container class="layout-container">
            <el-header class="site-header">
                <button class="brand" type="button" @click="toPage('https://shiaoyoung.github.io')">
                    <span class="brand__mark">SY</span>
                    <span class="brand__text">ShiaoYoung</span>
                </button>
                <nav class="quick-nav" aria-label="顶部快捷入口">
                    <el-button v-for="item in pinnedLinks" :key="item.label" class="nav-button" plain
                        @click="toPage(item.url)">
                        {{ item.label }}
                    </el-button>
                </nav>
            </el-header>

            <el-main class="main-content">
                <section class="hero" aria-labelledby="page-title">
                    <p class="hero__eyebrow">Personal Navigation</p>
                    <h1 id="page-title">常用网站快捷入口</h1>
                    <p>把学习、校园服务和开发工具集中在一个清爽的页面里，减少查找成本。</p>
                </section>

                <section class="link-section" v-for="group in linkGroups" :key="group.title"
                    :aria-labelledby="group.id">
                    <div class="section-heading">
                        <h2 :id="group.id">{{ group.title }}</h2>
                        <p>{{ group.description }}</p>
                    </div>
                    <div class="link-grid">
                        <button class="link-card" type="button" v-for="link in group.links" :key="link.label"
                            @click="toPage(link.url)">
                            <span class="link-card__title">{{ link.label }}</span>
                            <span class="link-card__url">{{ link.host }}</span>
                        </button>
                    </div>
                </section>
            </el-main>

            <el-footer class="site-footer">ShiaoYoung 的首页 © 2024 Created by ShiaoYoung</el-footer>
        </el-container>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            setup() {
                const pinnedLinks = [
                    { label: '教务系统', url: 'http://bkzhjx.wh.sdu.edu.cn/sso.jsp' },
                    { label: '信息服务', url: 'https://service.sdu.edu.cn/' },
                    { label: '力扣', url: 'https://leetcode.cn/' },
                    { label: 'DeepSeek', url: 'https://chat.deepseek.com/' },
                    { label: 'CSDN', url: 'https://www.csdn.net/' },
                    { label: 'GitHub', url: 'https://github.com/' }
                ];

                const linkGroups = [
                    {
                        id: 'school-services',
                        title: '学校服务',
                        description: '校园信息、教学系统与校内服务。',
                        links: [
                            { label: '山大官网', url: 'https://www.sdu.edu.cn', host: 'sdu.edu.cn' },
                            { label: '山大软院', url: 'https://www.sc.sdu.edu.cn/', host: 'sc.sdu.edu.cn' },
                            { label: '时空视点', url: 'https://shikong.sdu.edu.cn/', host: 'shikong.sdu.edu.cn' },
                            { label: '图书馆', url: 'https://library.sdu.edu.cn/', host: 'library.sdu.edu.cn' },
                            { label: '山大日记', url: 'https://www.sdrj.sdu.edu.cn/', host: 'sdrj.sdu.edu.cn' },
                            { label: '学生在线', url: 'https://online.sdu.edu.cn/', host: 'online.sdu.edu.cn' },
                            { label: '青春山大', url: 'https://www.youth.sdu.edu.cn/', host: 'youth.sdu.edu.cn' },
                            { label: '本科生院', url: 'https://www.bkjx.sdu.edu.cn/', host: 'bkjx.sdu.edu.cn' },
                            { label: '教务系统', url: 'http://bkzhjx.wh.sdu.edu.cn/sso.jsp', host: 'bkzhjx.wh.sdu.edu.cn' },
                            { label: '山大云盘', url: 'https://icloud.qd.sdu.edu.cn:7777/#/home', host: 'icloud.qd.sdu.edu.cn' },
                            { label: '信息服务', url: 'https://service.sdu.edu.cn/', host: 'service.sdu.edu.cn' },
                            { label: '校园网', url: 'http://202.194.15.87/', host: '202.194.15.87' },
                            { label: '交通班车', url: 'http://www.sd114.sdu.edu.cn:8080/web/bus/index', host: 'sd114.sdu.edu.cn' },
                            { label: '山大AI助手', url: 'https://aiassist.sdu.edu.cn/', host: 'aiassist.sdu.edu.cn' }
                        ]
                    },
                    {
                        id: 'tool-sites',
                        title: '工具网站',
                        description: '开发、学习、检索和日常效率工具。',
                        links: [
                            { label: 'CSDN', url: 'https://www.csdn.net/', host: 'csdn.net' },
                            { label: 'GitHub', url: 'https://github.com/', host: 'github.com' },
                            { label: 'Element Plus', url: 'https://element-plus.org/zh-CN/', host: 'element-plus.org' },
                            { label: '哔哩哔哩', url: 'https://www.bilibili.com/', host: 'bilibili.com' },
                            { label: '阿里图标库', url: 'https://www.iconfont.cn/', host: 'iconfont.cn' },
                            { label: '数据库设计', url: 'https://www.drawdb.app', host: 'drawdb.app' },
                            { label: '力扣', url: 'https://leetcode.cn/', host: 'leetcode.cn' },
                            { label: '知乎', url: 'https://www.zhihu.com/', host: 'zhihu.com' },
                            { label: '中国知网', url: 'https://mtxml.oversea.cnki.net/', host: 'cnki.net' },
                            { label: '雨课堂', url: 'https://changjiang.yuketang.cn/v2/web/index', host: 'yuketang.cn' },
                            { label: '学信网', url: 'https://www.chsi.com.cn/', host: 'chsi.com.cn' },
                            { label: 'Gitee', url: 'https://gitee.com/', host: 'gitee.com' }
                        ]
                    }
                ];

                function toPage(url) {
                    window.open(url, '_blank', 'noopener,noreferrer');
                }

                return {
                    pinnedLinks,
                    linkGroups,
                    toPage
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>

    <style>
        :root {
            color: #25313d;
            background: #eef4f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
        }

        button {
            font: inherit;
        }

        .layout-container {
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(71, 156, 187, 0.16), rgba(239, 151, 72, 0.12)),
                #f6f8fb;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            height: auto;
            min-height: 72px;
            padding: 0.85rem clamp(1rem, 4vw, 3rem);
            border-bottom: 1px solid rgba(80, 105, 128, 0.16);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            min-width: max-content;
            padding: 0;
            color: #192633;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .brand__mark {
            display: inline-grid;
            place-items: center;
            width: 42px;
            height: 42px;
            color: #fff;
            font-weight: 800;
            border-radius: 8px;
            background: #2c7da0;
        }

        .brand__text {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .quick-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .nav-button.el-button {
            margin: 0;
            border-radius: 8px;
            color: #245f78;
            border-color: rgba(44, 125, 160, 0.34);
            background: #fff;
        }

        .main-content {
            width: min(1120px, 100%);
            margin: 0 auto;
            padding: clamp(1rem, 3vw, 2rem);
        }

        .hero {
            margin: 1rem 0 1.4rem;
            padding: clamp(1.25rem, 4vw, 2.5rem);
            color: #17212b;
            border: 1px solid rgba(80, 105, 128, 0.14);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.84);
            box-shadow: 0 20px 50px rgba(32, 58, 77, 0.08);
        }

        .hero__eyebrow {
            margin: 0 0 0.55rem;
            color: #2c7da0;
            font-weight: 800;
        }

        .hero h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2rem, 6vw, 4rem);
            line-height: 1.08;
        }

        .hero p:last-child {
            max-width: 760px;
            margin: 0;
            color: #566575;
            font-size: 1.08rem;
            line-height: 1.8;
        }

        .link-section {
            margin: 1.25rem 0;
        }

        .section-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.85rem;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 1.45rem;
        }

        .section-heading p {
            margin: 0;
            color: #697887;
            text-align: right;
        }

        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 0.85rem;
        }

        .link-card {
            display: flex;
            min-height: 92px;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.6rem;
            padding: 1rem;
            text-align: left;
            color: #22303d;
            border: 1px solid rgba(80, 105, 128, 0.14);
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 12px 28px rgba(32, 58, 77, 0.06);
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .link-card:hover,
        .link-card:focus-visible {
            border-color: rgba(44, 125, 160, 0.55);
            box-shadow: 0 18px 36px rgba(32, 58, 77, 0.12);
            transform: translateY(-2px);
            outline: none;
        }

        .link-card__title {
            font-size: 1.05rem;
            font-weight: 800;
        }

        .link-card__url {
            overflow: hidden;
            color: #6b7a88;
            font-size: 0.86rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .site-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 56px;
            color: #697887;
            font-size: 0.9rem;
        }

        @media (max-width: 720px) {
            .site-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .quick-nav {
                justify-content: flex-start;
                width: 100%;
            }

            .nav-button.el-button {
                flex: 1 1 30%;
                min-width: 92px;
            }

            .section-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .section-heading p {
                text-align: left;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .link-card {
                transition: none;
            }

            .link-card:hover,
            .link-card:focus-visible {
                transform: none;
            }
        }
    </style>
</body>

</html>
